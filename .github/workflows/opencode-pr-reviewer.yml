name: OpenCode Professional PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@v1.14.20
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}   # e.g. https://YOUR-RESOURCE.openai.azure.com
          AZURE_OPENAI_API_VERSION: "2025-04-01-preview"                # or your target API version
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: gpt-5.4-nano   # must match your Azure deployment name exactly
          use_github_token: true
          prompt: |
            Using the instructions in .opencode/skills/pr-code-review/SKILL.md, 
            perform a review on this PR: ${{ github.event.pull_request.html_url }} --comment
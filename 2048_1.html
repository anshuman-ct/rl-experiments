<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        body {
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            background-color: ##e3e1d8;
            color: #776e65;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 0 auto;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            margin: 0;
        }

        .scores-container {
            display: flex;
            gap: 5px;
        }

        .score-container, .best-container {
            background-color: #bbada0;
            padding: 15px 25px;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
        }

        .score-title {
            color: #eee4da;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .score-value {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .above-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .game-intro {
            font-size: 18px;
        }

        .restart-button, #auto-solve-button {
            background-color: #8f7a66;
            color: white;
            padding: 10px 20px;
            width: 130px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border: none;
            font-family: inherit;
            font-size: inherit;
        }
        
        #auto-solve-button {
             margin-top: 10px;
        }


        .game-container {
            margin-top: 20px;
            background-color: #bbada0;
            border-radius: 6px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 15px;
            width: 475px;
            height: 475px;
            box-sizing: border-box;
            position: relative;
        }

        .grid-cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
        }

        .tile-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .tile {
            position: absolute;
            width: 100px;
            height: 100px;
            line-height: 100px;
            text-align: center;
            font-weight: bold;
            font-size: 55px;
            border-radius: 3px;
            transition: top 100ms ease-in-out, left 100ms ease-in-out;
            transform: translate(0,0);
        }
        
        .tile.tile-new {
            animation: appear 200ms ease-in-out;
            animation-fill-mode: forwards;
        }
        
        .tile.tile-merged-pop {
             animation: pop 200ms ease-in-out;
             animation-fill-mode: forwards;
        }

        @keyframes appear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 45px; }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 45px; }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 45px; }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 35px; }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 35px; }
        .tile-4096 { background-color: #3c3a32; color: #f9f6f2; font-size: 35px; }
        .tile-8192 { background-color: #3c3a32; color: #f9f6f2; font-size: 35px; }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(238, 228, 218, 0.73);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-weight: bold;
            color: #776e65;
            border-radius: 6px;
            animation: fade-in 600ms ease-in-out;
            animation-fill-mode: forwards;
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .game-over p { margin: 0; }
        .game-over .lower { font-size: 20px; margin-top: 20px; }
        .game-over a {
            text-decoration: none;
            background-color: #8f7a66;
            color: white;
            padding: 10px 20px;
            border-radius: 3px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="heading">
        <h1 class="title">2048</h1>
        <div class="scores-container">
            <div class="score-container">
                <div class="score-title">Score</div>
                <div id="score" class="score-value">0</div>
            </div>
            <div class="best-container">
                <div class="score-title">Best</div>
                <div id="best-score" class="score-value">0</div>
            </div>
        </div>
    </div>

    <div class="above-game">
        <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
        <div>
            <button class="restart-button">New Game</button>
            <button id="auto-solve-button">Auto-Solve</button>
        </div>
    </div>

    <div class="game-container">
        <div id="game-over-screen" class="game-over hidden">
            <p>Game Over!</p>
            <div class="lower">
                <a class="retry-button">Try again</a>
            </div>
        </div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div id="tile-container" class="tile-container"></div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const tileContainer = document.getElementById('tile-container');
    const scoreElement = document.getElementById('score');
    const bestScoreElement = document.getElementById('best-score');
    const gameOverScreen = document.getElementById('game-over-screen');
    const restartButtons = document.querySelectorAll('.restart-button, .retry-button');
    const gameContainer = document.querySelector('.game-container');
    const autoSolveButton = document.getElementById('auto-solve-button');

    const gridSize = 4;
    let grid = [];
    let score = 0;
    let bestScore = localStorage.getItem('bestScore') || 0;
    bestScoreElement.textContent = bestScore;
    let isMoving = false;
    let isSolving = false;
    
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeThreshold = 30;

    function getPosition(row, col) {
        return {
            top: row * (100 + 15) + 15,
            left: col * (100 + 15) + 15
        };
    }

    function clearTiles() {
        while (tileContainer.firstChild) tileContainer.removeChild(tileContainer.firstChild);
    }

    function addRandomTile() {
        const emptyCells = [];
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (!grid[r][c]) emptyCells.push({ r, c });
            }
        }
        if (emptyCells.length > 0) {
            const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            grid[r][c] = { value, merged: false, justAdded: true, id: Math.random() + "" };
        }
    }

    function updateScore(newScore) {
        score = newScore;
        scoreElement.textContent = score;
        if (score > bestScore) {
            bestScore = score;
            bestScoreElement.textContent = bestScore;
            localStorage.setItem('bestScore', bestScore);
        }
    }

    function renderGrid() {
        clearTiles();
        const mergedTilesToAnimate = [];

        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                let cell = grid[r][c];
                if (cell && cell.value) {
                    const tile = document.createElement('div');
                    const pos = getPosition(r, c);
                    
                    tile.className = `tile tile-${cell.value}`;
                    tile.style.top = `${pos.top}px`;
                    tile.style.left = `${pos.left}px`;
                    tile.textContent = cell.value;
                    tile.dataset.id = cell.id;

                    if (cell.justAdded) {
                        tile.classList.add('tile-new');
                        delete cell.justAdded;
                    }
                    if (cell.mergedFrom) {
                        mergedTilesToAnimate.push(tile);
                        delete cell.mergedFrom;
                    }

                    tileContainer.appendChild(tile);
                }
            }
        }
        
        requestAnimationFrame(() => {
            mergedTilesToAnimate.forEach(tile => {
                tile.classList.add('tile-merged-pop');
            });
        });
    }

    async function move(direction) {
        if (isMoving) return;
        isMoving = true;
        
        let prevGrid = grid.map(row => row.map(cell => cell ? { ...cell } : null));
        let pointsToAdd = 0;
        let moved = false;
        
        let tilePositions = {};
        for (let r = 0; r < gridSize; r++) for (let c = 0; c < gridSize; c++) if (grid[r][c]) tilePositions[grid[r][c].id] = { r, c };

        let workingGrid = (direction === 'ArrowUp' || direction === 'ArrowDown') ? transpose(grid) : grid.map(row => row.slice());

        for (let i = 0; i < gridSize; i++) {
            const originalRow = JSON.stringify(workingGrid[i]);
            let row = workingGrid[i].filter(cell => cell);
            if (direction === 'ArrowRight' || direction === 'ArrowDown') row.reverse();

            for (let j = 0; j < row.length - 1; j++) {
                if (row[j].value === row[j+1].value) {
                    let mergedValue = row[j].value * 2;
                    pointsToAdd += mergedValue;
                    row[j] = { value: mergedValue, id: row[j+1].id, mergedFrom: [row[j].id, row[j+1].id] };
                    row.splice(j+1, 1);
                }
            }
            while (row.length < gridSize) row.push(null);
            if (direction === 'ArrowRight' || direction === 'ArrowDown') row.reverse();
            workingGrid[i] = row;
            if (JSON.stringify(workingGrid[i]) !== originalRow) moved = true;
        }

        grid = (direction === 'ArrowUp' || direction === 'ArrowDown') ? transpose(workingGrid) : workingGrid;

        const tilesToMove = [];
        for (let r = 0; r < gridSize; r++) for (let c = 0; c < gridSize; c++) {
            if (grid[r][c]) {
                if (grid[r][c].mergedFrom) {
                    grid[r][c].mergedFrom.forEach(id => tilesToMove.push({ id, r, c }));
                } else {
                    tilesToMove.push({ id: grid[r][c].id, r, c });
                }
            }
        }
        
        clearTiles();
        for (let id in tilePositions) {
            const tile = document.createElement('div');
            const {r, c} = tilePositions[id];
            const value = prevGrid[r][c].value;
            const pos = getPosition(r,c);
            tile.className = `tile tile-${value}`;
            tile.textContent = value;
            tile.style.top = `${pos.top}px`;
            tile.style.left = `${pos.left}px`;
            tile.dataset.id = id;
            tileContainer.appendChild(tile);
        }

        await new Promise(r => requestAnimationFrame(r));
        gameContainer.offsetHeight; // This forces the browser to paint
        for (let domTile of tileContainer.children) {
            const moveData = tilesToMove.find(t => t.id === domTile.dataset.id);
            if (moveData) {
                const { r, c } = moveData;
                const pos = getPosition(r, c);
                domTile.style.transition = 'top 120ms ease-in-out, left 120ms ease-in-out';
                domTile.style.top = `${pos.top}px`;
                domTile.style.left = `${pos.left}px`;
            }
        }
        
        await new Promise(res => setTimeout(res, 120));

        if (pointsToAdd > 0) updateScore(score + pointsToAdd);
        if (moved) {
            addRandomTile();
        }
        renderGrid();
        
        if (isGameOver()) {
            stopSolver();
            gameOverScreen.classList.remove('hidden');
        }
        isMoving = false;
    }

    function transpose(matrix) {
        return matrix[0].map((col, i) => matrix.map(row => row[i]));
    }

    function canMove(currentGrid) {
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (!currentGrid[r][c]) return true;
                if (r < gridSize - 1 && currentGrid[r+1][c] && currentGrid[r][c].value === currentGrid[r+1][c].value) return true;
                if (c < gridSize - 1 && currentGrid[r][c+1] && currentGrid[r][c].value === currentGrid[r][c+1].value) return true;
            }
        }
        return false;
    }

    function isGameOver() { return !canMove(grid); }

    function startGame() {
        stopSolver();
        grid = Array(gridSize).fill().map(() => Array(gridSize).fill(null));
        updateScore(0);
        addRandomTile();
        addRandomTile();
        renderGrid();
        gameOverScreen.classList.add('hidden');
        isMoving = false;
    }

    // --- DYNAMIC AI SOLVER IMPLEMENTATION ---
    function startSolver() {
        if (isSolving) return;
        isSolving = true;
        autoSolveButton.textContent = "Stop";
        autoSolveButton.style.backgroundColor = '#f65e3b';
        setTimeout(thinkAndMove, 100);
    }

    async function thinkAndMove() {
        if (!isSolving || isGameOver()) {
            stopSolver();
            return;
        }
        const bestMove = findBestMove(grid);
        if (bestMove) {
            await move(bestMove);
            setTimeout(thinkAndMove, 50);
        } else {
            stopSolver();
        }
    }

    function stopSolver() {
        isSolving = false;
        autoSolveButton.textContent = "Auto-Solve";
        autoSolveButton.style.backgroundColor = '#8f7a66';
    }

    function toggleSolver() {
        if (isSolving) stopSolver();
        else startSolver();
    }

    function findBestMove(currentGrid) {
        let bestMove = null;
        let bestScore = -Infinity;
        
        const emptyCells = currentGrid.flat().filter(c => !c).length;
        const depth = emptyCells > 6 ? 4 : (emptyCells > 3 ? 5 : 5);

        for (const direction of ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']) {
            const { newGrid, moved } = simulateMove(currentGrid, direction);
            if (moved) {
                const score = expectimax(newGrid, depth, false, -Infinity, Infinity);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = direction;
                }
            }
        }
        return bestMove;
    }

    function expectimax(nodeGrid, depth, isPlayerTurn, alpha, beta) {
        if (depth === 0 || !canMove(nodeGrid)) {
            return evaluateGrid(nodeGrid);
        }
        
        if (isPlayerTurn) {
            let maxScore = -Infinity;
            for (const direction of ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']) {
                const { newGrid, moved } = simulateMove(nodeGrid, direction);
                if (moved) {
                    const score = expectimax(newGrid, depth - 1, false, alpha, beta);
                    maxScore = Math.max(maxScore, score);
                    alpha = Math.max(alpha, score);
                    if (beta <= alpha) break;
                }
            }
            return maxScore;
        } else {
            let totalScore = 0;
            let emptyCells = [];
            for (let r = 0; r < gridSize; r++) for (let c = 0; c < gridSize; c++) if (!nodeGrid[r][c]) emptyCells.push({r,c});
            if (emptyCells.length === 0) return evaluateGrid(nodeGrid);
            
            for (const { r, c } of emptyCells) {
                let grid2 = JSON.parse(JSON.stringify(nodeGrid)); grid2[r][c] = { value: 2 };
                totalScore += 0.9 * expectimax(grid2, depth - 1, true, alpha, beta);
                let grid4 = JSON.parse(JSON.stringify(nodeGrid)); grid4[r][c] = { value: 4 };
                totalScore += 0.1 * expectimax(grid4, depth - 1, true, alpha, beta);
            }
            return totalScore / emptyCells.length;
        }
    }

    // --- NEW DYNAMIC EVALUATION "BRAIN" ---

    // The new "brain" of the AI. It evaluates the board from four different perspectives (one for each 
    // corner snake) and takes the best possible score. This allows it to be strategically flexible.
    function evaluateGrid(nodeGrid) {
        // Create four versions of the board: original, flipped horizontally, vertically, and both.
        const orientations = [
            nodeGrid,
            flipHorizontal(nodeGrid),
            flipVertical(nodeGrid),
            flipVertical(flipHorizontal(nodeGrid))
        ];

        // Calculate the score for each orientation and return the maximum.
        // This means the AI's "score" for a board is its score in its BEST possible orientation.
        let maxScore = -Infinity;
        for (const gridOrientation of orientations) {
            maxScore = Math.max(maxScore, calculateScoreWithMatrix(gridOrientation));
        }
        return maxScore;
    }

    // A helper function that calculates the score for a given grid against ONE canonical snake pattern.
    function calculateScoreWithMatrix(grid) {
        // Snake matrix
        const weightMatrix = [
            [262144, 131072, 65536, 32768],
            [  2048,   4096,  8192, 16384],
            [  1024,    512,   256,   128],
            [     8,     16,    32,    64],
        ]
        // Spiral matrix
        // const weightMatrix = [
        //     [262144, 131072, 65536, 32768],
        //     [   128,     64,    32, 16384],
        //     [   256,      4,    16,  8192],
        //     [   512,   1024,  2048,  4096],
        // ];

        let gridScore = 0;
        let emptyCells = 0;
        let smoothness = 0;

        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                const cell = grid[r][c];
                if (cell) {
                    gridScore += cell.value * weightMatrix[r][c];
                    if (c < gridSize - 1 && grid[r][c+1]) {
                        smoothness -= Math.abs(Math.log2(cell.value) - Math.log2(grid[r][c+1].value));
                    }
                    if (r < gridSize - 1 && grid[r+1][c]) {
                        smoothness -= Math.abs(Math.log2(cell.value) - Math.log2(grid[r+1][c].value));
                    }
                } else {
                    emptyCells++;
                }
            }
        }
        
        const emptyCellBonus = Math.log(emptyCells + 1) * 20000;
        return gridScore + emptyCellBonus + (smoothness * 10);
    }

    // --- Grid transformation helpers ---
    function flipHorizontal(grid) {
        return grid.map(row => row.slice().reverse());
    }

    function flipVertical(grid) {
        return grid.slice().reverse();
    }
    
    function simulateMove(simGrid, direction) {
        let gridCopy = JSON.parse(JSON.stringify(simGrid));
        let moved = false;
        let workingGrid = (direction === 'ArrowUp' || direction === 'ArrowDown') ? transpose(gridCopy) : gridCopy;
        
        for (let i = 0; i < gridSize; i++) {
            const originalRow = JSON.stringify(workingGrid[i]);
            let row = workingGrid[i].filter(cell => cell);
            if (direction === 'ArrowRight' || direction === 'ArrowDown') row.reverse();
            for (let j = 0; j < row.length - 1; j++) {
                if (row[j].value === row[j+1].value) {
                    row[j].value *= 2;
                    row.splice(j + 1, 1);
                }
            }
            while (row.length < gridSize) row.push(null);
            if (direction === 'ArrowRight' || direction === 'ArrowDown') row.reverse();
            workingGrid[i] = row;
            if(JSON.stringify(workingGrid[i]) !== originalRow) moved = true;
        }
        let newGrid = (direction === 'ArrowUp' || direction === 'ArrowDown') ? transpose(workingGrid) : workingGrid;
        return { newGrid, moved };
    }

    document.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            stopSolver();
            move(e.key);
        }
    });

    gameContainer.addEventListener('touchstart', (e) => {
        stopSolver();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    gameContainer.addEventListener('touchmove', (e) => {
        if (touchStartX && touchStartY) e.preventDefault();
    }, { passive: false });

    gameContainer.addEventListener('touchend', (e) => {
        if (!touchStartX || !touchStartY) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        if (Math.abs(diffX) < swipeThreshold && Math.abs(diffY) < swipeThreshold) {
            touchStartX = 0; touchStartY = 0; return;
        }
        let direction = Math.abs(diffX) > Math.abs(diffY)
            ? (diffX > 0 ? 'ArrowRight' : 'ArrowLeft')
            : (diffY > 0 ? 'ArrowDown' : 'ArrowUp');
        if (direction) move(direction);
        touchStartX = 0; touchStartY = 0;
    });

    restartButtons.forEach(button => button.addEventListener('click', startGame));
    autoSolveButton.addEventListener('click', toggleSolver);

    startGame();
});
</script>
</body>
</html>
